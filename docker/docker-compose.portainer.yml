version: '3.8'

# WhatsApp CRM API - Portainer Deployment
# Uses Node.js base image with pnpm install at runtime

services:
  api:
    image: node:20-alpine
    container_name: whatsapp-crm-api
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "
        apk add --no-cache python3 make g++ git wget &&
        npm install -g pnpm &&
        if [ ! -f /app/apps/api/package.json ]; then
          rm -rf /app/* /app/.* 2>/dev/null || true &&
          git clone --depth 1 https://github.com/YlunoZup/Whatsapp-CRM.git /tmp/repo &&
          cp -r /tmp/repo/* /app/ &&
          rm -rf /tmp/repo
        fi &&
        cd /app &&
        HUSKY=0 pnpm install --filter @whatsapp-crm/api... &&
        cd /app/apps/api &&
        node node_modules/prisma/build/index.js generate &&
        node node_modules/prisma/build/index.js db push --accept-data-loss &&
        pnpm run build &&
        node dist/main.js
      "
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TLS=${REDIS_TLS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - whatsapp_sessions:/app/apps/api/.whatsapp-sessions
      - api_code:/app
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 60s
      timeout: 30s
      start_period: 300s
      retries: 5
    networks:
      - whatsapp-crm-net

networks:
  whatsapp-crm-net:
    driver: bridge

volumes:
  whatsapp_sessions:
    driver: local
  api_code:
    driver: local
