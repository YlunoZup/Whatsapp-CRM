version: '3.8'

# WhatsApp CRM API - Portainer Deployment
# Uses external NeonDB (Postgres) and Upstash (Redis)
# Frontend is deployed on Vercel

services:
  api:
    image: ghcr.io/ylunozup/whatsapp-crm-api:latest
    build:
      context: ../
      dockerfile: docker/Dockerfile.api
    container_name: whatsapp-crm-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Database (NeonDB)
      - DATABASE_URL=${DATABASE_URL}
      # Redis (Upstash)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_TLS=${REDIS_TLS}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      # CORS - Vercel frontend
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Encryption
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - whatsapp_sessions:/app/apps/api/.whatsapp-sessions
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - whatsapp-crm-net

networks:
  whatsapp-crm-net:
    driver: bridge

volumes:
  whatsapp_sessions:
    driver: local
