version: '3.8'

# WhatsApp CRM API - Portainer Deployment
# Uses Node.js base image with pnpm install at runtime
# Includes local Redis for caching (no external service limits)

services:
  redis:
    image: redis:7-alpine
    container_name: whatsapp-crm-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - whatsapp-crm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    image: node:20-alpine
    container_name: whatsapp-crm-api
    restart: unless-stopped
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "
        apk add --no-cache python3 make g++ git wget openssl &&
        npm install -g pnpm &&
        echo 'Fetching latest code from GitHub...' &&
        rm -rf /tmp/repo &&
        git clone --depth 1 https://github.com/YlunoZup/Whatsapp-CRM.git /tmp/repo &&
        rm -rf /app/apps /app/packages /app/package.json /app/pnpm-workspace.yaml /app/tsconfig*.json 2>/dev/null || true &&
        cp -r /tmp/repo/apps /tmp/repo/packages /tmp/repo/package.json /tmp/repo/pnpm-workspace.yaml /tmp/repo/tsconfig*.json /app/ 2>/dev/null || true &&
        rm -rf /tmp/repo &&
        cd /app &&
        NODE_ENV=development HUSKY=0 pnpm install --filter @whatsapp-crm/api... &&
        cd /app/apps/api &&
        pnpm run prisma:generate &&
        pnpm run prisma:push -- --accept-data-loss &&
        pnpm run build &&
        node dist/main.js
      "
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_TLS=false
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - whatsapp_sessions:/app/apps/api/.whatsapp-sessions
      - api_code:/app
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3001/api/v1/health"]
      interval: 60s
      timeout: 30s
      start_period: 300s
      retries: 5
    networks:
      - whatsapp-crm-net

networks:
  whatsapp-crm-net:
    driver: bridge

volumes:
  whatsapp_sessions:
    driver: local
  api_code:
    driver: local
  redis_data:
    driver: local
