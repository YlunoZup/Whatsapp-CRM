version: '3.8'

# Production deployment for Portainer
# Uses external NeonDB (Postgres) and Upstash (Redis)

services:
  # WhatsApp CRM API
  api:
    build:
      context: ../
      dockerfile: docker/Dockerfile.api
    container_name: whatsapp-crm-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Database (NeonDB)
      - DATABASE_URL=${DATABASE_URL}
      # Redis (Upstash)
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1d}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      # CORS - your frontend domain
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # Encryption
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      # CRITICAL: Persist WhatsApp session data
      - whatsapp_sessions:/app/apps/api/.whatsapp-sessions
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - whatsapp-crm-network

  # WhatsApp CRM Web Frontend
  web:
    build:
      context: ../
      dockerfile: docker/Dockerfile.web
      args:
        - VITE_API_URL=${VITE_API_URL:-/api/v1}
    container_name: whatsapp-crm-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - whatsapp-crm-network

networks:
  whatsapp-crm-network:
    driver: bridge

volumes:
  whatsapp_sessions:
    driver: local
